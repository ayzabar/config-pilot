services:
  schema-server:
    build: ./schema-server
    container_name: schema-server
    restart: always
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data

  values-server:
    build: ./values-server
    container_name: values-server
    restart: always
    ports:
      - "5002:5002"
    volumes:
      - ./data:/app/data

  bot-server:
    build: ./bot-server
    container_name: bot-server
    restart: always
    ports:
      - "5003:5003"
    environment:
      - SCHEMA_SERVICE_URL=http://schema-server:5001
      - VALUES_SERVICE_URL=http://values-server:5002
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - schema-server
      - values-server
